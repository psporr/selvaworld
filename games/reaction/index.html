<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="g.reaction" data-i18n-after=" · Selva World">Selva World</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    #pad {
      height: min(60vh, 440px); border-radius: var(--radius); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; cursor: pointer; user-select: none;
      -webkit-user-select: none; touch-action: manipulation; transition: background .08s; text-align: center; padding: 16px;
    }
    #pad .big { font-size: clamp(2rem, 7vw, 3.4rem); font-weight: 800; }
    #pad .small { font-size: 1.1rem; opacity: .85; }
    #pad.idle { background: var(--bg2); }
    #pad.wait { background: #9f1239; }
    #pad.go { background: #15803d; }
    #pad.early { background: #57534e; }
    #pad.done { background: #1e40af; }
    #pad.result, #pad.end { background: var(--card); border: 1px solid var(--line); }
    .ms { color: var(--muted); font-size: .85rem; margin-left: 6px; }
  </style>
</head>
<body>
  <header class="topbar"><a class="back" href="../../" data-i18n="c.home">← หน้าหลัก</a><h1>⚡ <span data-i18n="g.reaction">นิ้วไว</span></h1></header>
  <main>
    <section id="lobby"></section>
    <section id="game" hidden>
      <div class="game-layout">
        <div id="pad" class="idle"><div class="big" data-i18n="rx.ready"></div><div class="small" data-i18n="rx.howto"></div></div>
        <aside class="side">
          <h3 data-i18n="rx.score"></h3>
          <ul class="players" id="board"></ul>
          <button id="again" class="btn primary" hidden data-i18n="c.again"></button>
        </aside>
      </div>
    </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
