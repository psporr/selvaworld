<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selva World</title>
  <meta name="description" content="Selva World: เกมออนไลน์เล่นกับเพื่อนได้ 4 คนบนเว็บ">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <h1 class="logo">Selva World</h1>
    <p>เกมออนไลน์สั้นๆ เล่นกับเพื่อนได้สูงสุด 4 คน ไม่ต้องสมัคร ไม่ต้องลงแอป</p>
    <ol class="steps">
      <li><b>1.</b> เลือกเกม</li>
      <li><b>2.</b> สร้างห้อง</li>
      <li><b>3.</b> ส่งรหัสหรือลิงก์ให้เพื่อน</li>
      <li><b>4.</b> กดเริ่มเกม!</li>
    </ol>
  </header>

  <main class="wrap">
    <div class="games" id="games"></div>
  </main>

  <p class="footer">เชื่อมต่อแบบ peer-to-peer (WebRTC) เบราว์เซอร์ของคนสร้างห้องจะทำหน้าที่เป็นเซิร์ฟเวอร์</p>

  <script>
    // เพิ่มเกมใหม่: เพิ่ม object ในลิสต์นี้ และสร้างโฟลเดอร์ games/<id>/
    const GAMES = [
      { id: 'snake',    name: 'งูสี่ทิศ',      icon: '🐍', bg: 'linear-gradient(135deg,#14532d,#0f766e)',
        desc: 'เก็บผลไม้ให้ตัวยาว หลบงูของเพื่อน คนสุดท้ายที่รอดชนะ', players: '1–4 คน', tags: ['เรียลไทม์', 'แอ็กชัน'] },
      { id: 'reaction', name: 'นิ้วไว',         icon: '⚡', bg: 'linear-gradient(135deg,#7c2d12,#b45309)',
        desc: 'จอเปลี่ยนเป็นสีเขียวเมื่อไหร่ แตะให้ไวที่สุด แตะก่อนโดนหักคะแนน', players: '1–4 คน', tags: ['ปาร์ตี้', '5 รอบ'] },
      { id: 'dots',     name: 'จุดต่อกล่อง',   icon: '🔲', bg: 'linear-gradient(135deg,#312e81,#6d28d9)',
        desc: 'ผลัดกันลากเส้น ปิดกล่องได้ก็ได้แต้มและได้เล่นต่อ', players: '2–4 คน', tags: ['ผลัดกันเล่น', 'วางแผน'] },
    ];
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    document.getElementById('games').innerHTML = GAMES.map((g) => `
      <a class="game-card" href="games/${g.id}/">
        <div class="art" style="background:${g.bg}">${g.icon}</div>
        <div class="body">
          <h2>${esc(g.name)}</h2>
          <p>${esc(g.desc)}</p>
          <div class="tags"><span class="tag">👥 ${esc(g.players)}</span>${g.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        </div>
      </a>`).join('');
  </script>
</body>
</html>
